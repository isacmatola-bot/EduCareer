name: Production uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check application and Supabase
        id: health
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 15 --retry 2 \
            https://edu-career-chi.vercel.app/api/health

      - name: Open or update incident issue
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[monitor] EduCareer production is unavailable';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const incident = issues.find((issue) => issue.title === title);
            const body = `Automated health check failed at ${new Date().toISOString()}.\n\nEndpoint: https://edu-career-chi.vercel.app/api/health\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (incident) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: incident.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Fail workflow for GitHub notifications
        if: steps.health.outcome == 'failure'
        run: exit 1
